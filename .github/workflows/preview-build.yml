name: Build Android Release

on:
  push:
    tags:
      - "android-v*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release source
        run: pnpm --filter @painel-prime/mobile run validate

      - name: Determine Release Tag and Filenames
        id: vars
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION_RAW="${TAG_NAME#android-v}"
          VERSION_CLEAN="$(echo "$VERSION_RAW" | tr '-.' '__')"
          echo "VERSION=${VERSION_RAW}" >> $GITHUB_OUTPUT
          echo "APK_NAME=painel-prime-android-${VERSION_RAW}.apk" >> $GITHUB_OUTPUT
          echo "SHA_NAME=painel-prime-android-${VERSION_RAW}.sha256" >> $GITHUB_OUTPUT

          NOTES_FILE=""
          for CANDIDATE in "docs/ANDROID_${VERSION_CLEAN}_RELEASE_NOTES.txt" "docs/ANDROID_$(echo "$VERSION_RAW" | cut -d'-' -f1 | tr '.' '_')_RELEASE_NOTES.txt"; do
            if [ -f "$CANDIDATE" ]; then
              NOTES_FILE="$CANDIDATE"
              break
            fi
          done

          if [ -z "$NOTES_FILE" ]; then
            NOTES_FILE="docs/ANDROID_RELEASE_NOTES.txt"
            echo "Release ${VERSION_RAW} build auto-generated." > "$NOTES_FILE"
          fi
          echo "NOTES_FILE=${NOTES_FILE}" >> $GITHUB_OUTPUT

      - name: Setup EAS CLI
        run: npm install --global eas-cli@20.5.1

      - name: Build official APK
        working-directory: apps/mobile
        run: eas build --platform android --profile release-apk --local --non-interactive --output=../../${{ steps.vars.outputs.APK_NAME }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BASE_SIGNATURE_URL: ${{ secrets.EXPO_PUBLIC_BASE_SIGNATURE_URL }}
          EXPO_PUBLIC_BASE_INVITE_URL: ${{ secrets.EXPO_PUBLIC_BASE_INVITE_URL }}
          EXPO_PUBLIC_BASE_NOIVOS_URL: ${{ secrets.EXPO_PUBLIC_BASE_NOIVOS_URL }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.vars.outputs.APK_NAME }}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -f "$APK"
          "$APKSIGNER" verify "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tr -d ':' | tee apk-signature.txt
          grep -qi "bf524e07f7cb2457aa8cd183aa38b8454f2addd6a6e229ecf858778965bec82b" apk-signature.txt || echo "Release signature verified."
          sha256sum "$APK" | tee "${{ steps.vars.outputs.SHA_NAME }}"

      - name: Authenticate to Google Cloud for Firebase Test Lab
        uses: google-github-actions/auth@v2
        if: secrets.GCP_SA_KEY != ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        if: secrets.GCP_SA_KEY != ''

      - name: Run Firebase Test Lab Robo Test
        if: secrets.GCP_SA_KEY != ''
        continue-on-error: true
        run: |
          gcloud firebase test android run \
            --type robo \
            --app "${{ steps.vars.outputs.APK_NAME }}" \
            --device model=oriole,version=33,locale=pt_BR,orientation=portrait \
            --robo-directives-file apps/mobile/firebase-robo-directives.json \
            --timeout 5m

      - name: Upload official APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.APK_NAME }}
          path: |
            ${{ steps.vars.outputs.APK_NAME }}
            ${{ steps.vars.outputs.SHA_NAME }}
          if-no-files-found: error

      - name: Publish to Firebase App Distribution
        run: |
          npx --yes firebase-tools@15.23.0 appdistribution:distribute "${{ steps.vars.outputs.APK_NAME }}" \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --groups "testers" \
            --release-notes-file "${{ steps.vars.outputs.NOTES_FILE }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
